<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ANALYTICAL ENGINE // CORE</title>
<style>
  :root{
    --bg:rgba(18, 18, 24, 0.6);
    --cyan:#ffffff;
    --cyan-dim:#5a5a5a;
    --amber:#e6e6e6;
    --line:rgba(255,255,255,0.25);
    --text:#d8d8d8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;background:transparent !important;
    font-family:'Courier New',monospace;
    color:var(--text);
    overflow:hidden;
  }
  #wrap{
    position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity 0.4s ease-out, transform 0.4s ease-out;
    transform: scale(0.94);
    background:transparent !important;
    pointer-events: none;
  }
  #wrap.window-visible{
    opacity:1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* The Floating Glass Island */
  .glass-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    padding: 20px;
  }

  canvas{display:block;}
  #status{
    position:absolute;top:18px;left:18px;
    font-size:11px;letter-spacing:2px;color:var(--cyan-dim);
    line-height:1.6;
    display:none;
  }
  #status b{color:var(--cyan);}
  #transcript{
    position:absolute;
    bottom: 50%;
    left: 0;
    width: 100%;
    transform: translateY(50%);
    text-align:center;
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;
    color:var(--cyan);
    padding: 15px 0;
    background: rgba(40, 40, 40, 0.7);
    backdrop-filter: blur(4px);
    border-top: 1px solid rgba(255,255,255,0.1);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    z-index: 10;
    transition:opacity .22s ease;
    pointer-events: none;
  }
  #transcript:empty {
    opacity: 0;
  }
  #transcript:not(:empty){
    opacity: 0.9;
    animation:caption-in .28s ease-out both;
  }
  @keyframes caption-in{
    from{opacity:0;transform:translateY(5px);}
    to{opacity:.9;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    #wrap{transition:none;}
    #transcript:not(:empty){animation:none;}
  }
  #controls{
    position:absolute;bottom:24px;display:none;gap:12px;
  }
  button{
    background:transparent;
    border:1px solid var(--cyan-dim);
    color:var(--cyan);
    font-family:inherit;
    font-size:11px;
    letter-spacing:2px;
    padding:10px 18px;
    cursor:pointer;
    transition:all .2s;
  }
  button:hover{background:rgba(255,255,255,0.1);border-color:var(--cyan);}
  button.active{background:rgba(255,255,255,0.15);border-color:var(--amber);color:var(--amber);}
  #hint{
    position:absolute;top:18px;right:18px;font-size:10px;color:var(--cyan-dim);
    text-align:right;line-height:1.6;max-width:220px;display:none;
  }
</style>
</head>
<body style="background: transparent !important;">
<div id="wrap">
  <div class="glass-container">
    <div id="status">GREAT&nbsp;SAGE&nbsp;— <b id="mode">STANDBY</b><br>AMPLITUDE&nbsp;<span id="amp">0.00</span></div>
    <canvas id="c"></canvas>
  </div>
  <div id="transcript"></div>
  <audio id="sage-audio" crossorigin="anonymous" style="display:none;"></audio>
  <audio id="sfx-startup" preload="auto" style="display:none;"></audio>
  <audio id="sfx-overlay-appear" preload="auto" style="display:none;"></audio>
  <audio id="sfx-core-open" preload="auto" style="display:none;"></audio>
  <audio id="sfx-core-close" preload="auto" style="display:none;"></audio>
  <audio id="sfx-interface-click" preload="auto" style="display:none;"></audio>
  <audio id="sfx-thinking" preload="auto" style="display:none;"></audio>
  <audio id="sfx-fail" preload="auto" style="display:none;"></audio>
  <audio id="sfx-crack" preload="auto" style="display:none;"></audio>
  <audio id="sfx-shatter" preload="auto" style="display:none;"></audio>
  <div id="controls">
    <button id="micBtn" style="fill-opacity: 0;">MIC</button>
    <button id="demoBtn">DEMO</button>
    <button id="stopBtn">STOP</button>
  </div>
</div>

<script src="core-geometry.js"></script>
<script src="effects.js"></script>
<script src="render-loop.js"></script>
<script src="bridge.js"></script>
<script src="main-init.js"></script>
</body>
</html>
