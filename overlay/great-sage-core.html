<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>ANALYTICAL ENGINE // CORE</title>
<style>
  :root{
    --bg:#000000;
    --cyan:#ffffff;
    --cyan-dim:#5a5a5a;
    --amber:#e6e6e6;
    --line:rgba(255,255,255,0.25);
    --text:#d8d8d8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;background:var(--bg);
    font-family:'Courier New',monospace;
    color:var(--text);
    overflow:hidden;
  }
  #wrap{
    position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity 0.5s ease-out;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
  }
  #wrap.window-visible{opacity:1;}
  canvas{display:block;}
  #status{
    position:absolute;top:18px;left:18px;
    font-size:11px;letter-spacing:2px;color:var(--cyan-dim);
    line-height:1.6;
  }
  #status b{color:var(--cyan);}
  #transcript{
    position:absolute;bottom:90px;max-width:80%;
    text-align:center;font-size:14px;letter-spacing:1px;
    color:var(--cyan);min-height:20px;opacity:0.9;
    text-shadow:0 0 8px rgba(255,255,255,0.6);
    transition:opacity .22s ease, transform .22s ease;
  }
  #transcript:not(:empty){animation:caption-in .28s ease-out both;}
  @keyframes caption-in{
    from{opacity:0;transform:translateY(5px);}
    to{opacity:.9;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    #wrap{transition:none;}
    #transcript:not(:empty){animation:none;}
  }
  #controls{
    position:absolute;bottom:24px;display:none;gap:12px;
  }
  button{
    background:transparent;
    border:1px solid var(--cyan-dim);
    color:var(--cyan);
    font-family:inherit;
    font-size:11px;
    letter-spacing:2px;
    padding:10px 18px;
    cursor:pointer;
    transition:all .2s;
  }
  button:hover{background:rgba(255,255,255,0.1);border-color:var(--cyan);}
  button.active{background:rgba(255,255,255,0.15);border-color:var(--amber);color:var(--amber);}
  #hint{
    position:absolute;top:18px;right:18px;font-size:10px;color:var(--cyan-dim);
    text-align:right;line-height:1.6;max-width:220px;display:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="status">GREAT&nbsp;SAGE&nbsp;— <b id="mode">STANDBY</b><br>AMPLITUDE&nbsp;<span id="amp">0.00</span></div>
  <canvas id="c"></canvas>
  <div id="transcript"></div>
  <audio id="sage-audio" crossorigin="anonymous" style="display:none;"></audio>
  <audio id="sfx-startup" preload="auto" style="display:none;"></audio>
  <audio id="sfx-overlay-appear" preload="auto" style="display:none;"></audio>
  <audio id="sfx-core-open" preload="auto" style="display:none;"></audio>
  <audio id="sfx-core-close" preload="auto" style="display:none;"></audio>
  <audio id="sfx-interface-click" preload="auto" style="display:none;"></audio>
  <audio id="sfx-thinking" preload="auto" style="display:none;"></audio>
  <audio id="sfx-fail" preload="auto" style="display:none;"></audio>
  <audio id="sfx-crack" preload="auto" style="display:none;"></audio>
  <audio id="sfx-shatter" preload="auto" style="display:none;"></audio>
  <div id="controls">
    <button id="micBtn" style="fill-opacity: 0;">MIC</button>
    <button id="demoBtn">DEMO</button>
    <button id="stopBtn">STOP</button>
  </div>
</div>

<script>
// Python bridge stubs (full implementations assigned before first paint completes)
window.setMode = window.setMode || function(){};
window.setCaption = window.setCaption || function(){};
window.setCaptionSynced = window.setCaptionSynced || function(){};
window.playVoiceLine = window.playVoiceLine || function(){ return Promise.resolve(); };
window.playUiSfx = window.playUiSfx || function(){};
window.triggerFailure = window.triggerFailure || function(){};
window.triggerSuccess = window.triggerSuccess || function(){};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize(); addEventListener('resize', resize);

const cx = () => canvas.width/2;
const cy = () => canvas.height/2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- Icosahedron-ish point cloud (approx via fibonacci sphere) ----
const N = 42;
const pts = [];
for(let i=0;i<N;i++){
  const y = 1 - (i/(N-1))*2;
  const r = Math.sqrt(1-y*y);
  const theta = Math.PI*(3-Math.sqrt(5))*i;
  pts.push({x:Math.cos(theta)*r, y:y, z:Math.sin(theta)*r});
}
const disp = pts.map(()=>({x:0,y:0,z:0, vx:0,vy:0,vz:0}));
const ptRest = pts.map(p=>({x:p.x,y:p.y,z:p.z}));
const ptBootFrom = pts.map(p=>{
  const mag = 2.4 + Math.random()*2.2;
  const j = () => (Math.random()-0.5)*0.35;
  return {x:p.x*mag+j(), y:p.y*mag+j(), z:p.z*mag+j()};
});
const BOOT_DURATION_MS = 1600;
let bootActive = true;
let bootStartTime = 0;
let bootGlow = 0;

const ringPulse = { active:false, start:0, kind:'open', mul:1 };
const RING_PULSE_MS = 300;
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function startRingPulse(kind){
  ringPulse.active = true;
  ringPulse.start = performance.now();
  ringPulse.kind = kind;
}
function updateRingPulse(){
  if(!ringPulse.active) return 1;
  const t = Math.min(1, (performance.now()-ringPulse.start)/RING_PULSE_MS);
  const e = easeOutCubic(t);
  if(ringPulse.kind === 'open'){
    ringPulse.mul = 1 + 0.15*(1-e);
  } else {
    ringPulse.mul = 0.9 + 0.1*e;
  }
  if(t >= 1){
    ringPulse.mul = 1;
    ringPulse.active = false;
  }
  return ringPulse.mul;
}
// connect nearest neighbors for wire look
const edges = [];
for(let i=0;i<N;i++){
  let dists = [];
  for(let j=0;j<N;j++){
    if(i===j) continue;
    const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, dz=pts[i].z-pts[j].z;
    dists.push([j, dx*dx+dy*dy+dz*dz]);
  }
  dists.sort((a,b)=>a[1]-b[1]);
  for(let k=0;k<3;k++){
    const j = dists[k][0];
    const key = i<j? i+'_'+j : j+'_'+i;
    if(!edges.find(e=>e.key===key)) edges.push({key, a:i, b:j});
  }
}

let angleX=0, angleY=0;
let amplitude=0, targetAmp=0;
let mode = 'standby'; // standby, mic, demo
let analyser=null, dataArray=null, audioCtx=null, stream=null;
const particles = [];
const orbits = [
  {radius:2.3, tilt:0.15, speed:0.9, n:2},
  {radius:2.9, tilt:-0.35, speed:0.6, n:3},
  {radius:3.5, tilt:0.5, speed:0.4, n:1},
];
const electrons = [];
orbits.forEach((o,oi)=>{
  for(let i=0;i<o.n;i++){
    electrons.push({
      orbit:oi,
      angle: (i/o.n)*Math.PI*2,
      escaped:false,
      ex:0, ey:0, evx:0, evy:0, life:1
    });
  }
});


let displayMode = 'standby';
let thinkingTickAngle = 0;
let thinkingTickTargetAngle = 0;
let thinkingTickLastStep = 0;
let thinkingTickFlashUntil = 0;
const THINKING_TICK_STEP_MS = 520;
const THINKING_TICK_INCREMENT = Math.PI / 4;

let outcomeGlowMultiplier = 1;
let outcomeGlowTarget = 1;
let outcomeGlowUntil = 0;

const successPing = {
  active: false,
  start: 0,
  startR: 0,
  endR: 0,
  pendingScale: false,
};

const CRACK_GROWTH_MS = 520;

const failureFx = {
  active: false,
  phase: 'idle', // idle, destabilize, recover
  phaseStarted: 0,
  scanGlitch: [],
};

function resetThinkingTick(){
  thinkingTickAngle = 0;
  thinkingTickTargetAngle = 0;
  thinkingTickLastStep = 0;
  thinkingTickFlashUntil = 0;
}

function shortestAngle(from, to){
  return Math.atan2(Math.sin(to-from), Math.cos(to-from));
}

function updateOutcomeGlow(now){
  if(now < outcomeGlowUntil){
    outcomeGlowMultiplier += (outcomeGlowTarget - outcomeGlowMultiplier) * 0.22;
  } else {
    outcomeGlowTarget = 1;
    outcomeGlowMultiplier += (1 - outcomeGlowMultiplier) * 0.1;
  }
}

function spawnFailureParticles(){
  const count = 15 + Math.floor(Math.random() * 6);
  for(let i=0;i<count;i++){
    particles.push({
      type: 'fail',
      x: Math.random() * canvas.width,
      y: -8 - Math.random() * 24,
      vx: (Math.random() - 0.5) * 1.4,
      vy: 1.2 + Math.random() * 2.8,
      size: 0.7 + Math.random() * 1.5,
      life: 1,
      maxLife: 1.5 + Math.random() * 0.55,
    });
  }
}

function createCracks(){
  const crackCount = 3 + Math.floor(Math.random() * 3);
  const minGap = Math.PI / 5;
  const baseAngles = [];
  let attempts = 0;
  while(baseAngles.length < crackCount && attempts < 100){
    attempts += 1;
    const candidate = Math.random() * Math.PI * 2;
    const spaced = baseAngles.every(a=>{
      const diff = Math.abs(Math.atan2(Math.sin(candidate - a), Math.cos(candidate - a)));
      return diff >= minGap;
    });
    if(spaced) baseAngles.push(candidate);
  }

  failureFx.scanGlitch = Array.from({length: 1 + Math.floor(Math.random() * 2)}, (_, i)=>({
    yNorm: (Math.random() - 0.5) * 0.28,
    phase: Math.random() * Math.PI * 2 + i * 1.7,
  }));

  failureFx.cracks = baseAngles.map(baseAngle=>{
    const points = [{angle: baseAngle, radius: 0.06}];
    let angle = baseAngle;
    for(let step = 1; step <= 4; step++){
      angle += (Math.random() - 0.5) * 0.02;
      points.push({
        angle,
        radius: 0.1 + step * (0.088 + Math.random() * 0.022),
      });
    }
    return points;
  });
}

function setFailurePhase(phase){
  failureFx.phase = phase;
  failureFx.phaseStarted = performance.now();
  if(phase === 'crack') createCracks();
  if(phase === 'shatter' && !reduceMotion) spawnShatterParticles();
}

function spawnShatterParticles(){
  // Removed in favor of structural destabilization
}

window.triggerFailure = ()=>{
  const now = performance.now();
  outcomeGlowTarget = 0.7;
  outcomeGlowUntil = now + 900;
  failureFx.active = true;
  failureFx.phase = 'destabilize';
  failureFx.phaseStarted = now;
  failureFx.scanGlitch = Array.from({length: 1 + Math.floor(Math.random() * 2)}, (_, i)=>({
    yNorm: (Math.random() - 0.5) * 0.28,
    phase: Math.random() * Math.PI * 2 + i * 1.7,
  }));
  playUiSfx('fail');

  // Polyhedron kick
  pts.forEach((p,i)=>{
    const kick = 0.35 + Math.random()*0.55;
    disp[i].vx = p.x * kick * (0.6 + Math.random()*0.6);
    disp[i].vy = p.y * kick * (0.6 + Math.random()*0.6);
    disp[i].vz = p.z * kick * (0.6 + Math.random()*0.6);
  });

  // Electron escape
  const escapeCount = 2 + Math.floor(Math.random()*2);
  const shuffled = [...electrons].sort(()=>Math.random()-0.5);
  shuffled.slice(0,escapeCount).forEach(e=>{
    e.escaped = true;
    e.life = 1;
    const o = orbits[e.orbit];
    const baseX = Math.cos(e.angle)*o.radius;
    const baseY = Math.sin(e.angle)*o.radius*Math.cos(o.tilt)*0.5;
    e.ex = baseX; e.ey = baseY;
    const tangentAngle = e.angle + Math.PI/2 + (Math.random()-0.5)*0.6;
    const spd = 2 + Math.random()*3;
    e.evx = Math.cos(tangentAngle)*spd;
    e.evy = Math.sin(tangentAngle)*spd*0.6;
  });

  setTimeout(()=>{
    failureFx.phase = 'recover';
    failureFx.phaseStarted = performance.now();
  }, 700);
};

window.triggerSuccess = ()=>{
  const now = performance.now();
  outcomeGlowTarget = 1.4;
  outcomeGlowUntil = now + 150;
  successPing.active = true;
  successPing.start = now;
  successPing.pendingScale = true;
};

// ---- Ambient dust field (always drifting, brighter with amplitude) ----
const DUST_N = 90;
const dust = [];
for(let i=0;i<DUST_N;i++){
  dust.push({
    a: Math.random()*Math.PI*2,
    r: 0.3+Math.random()*2.6,
    speed: 0.05+Math.random()*0.25,
    size: 0.6+Math.random()*1.4,
    phase: Math.random()*Math.PI*2
  });
}
// ---- Ring-hugging pulse particles (run along the rings like data ticks) ----
const RING_TICKS = 24;
const ticks = [];
for(let i=0;i<RING_TICKS;i++){
  ticks.push({ring:i%3, a:(i/RING_TICKS)*Math.PI*2, speed:0.3+Math.random()*0.4});
}

function rotate(p, ax, ay){
  let {x,y,z} = p;
  // rotate around Y
  let cosA=Math.cos(ay), sinA=Math.sin(ay);
  let x1 = x*cosA + z*sinA;
  let z1 = -x*sinA + z*cosA;
  // rotate around X
  let cosB=Math.cos(ax), sinB=Math.sin(ax);
  let y1 = y*cosB - z1*sinB;
  let z2 = y*sinB + z1*cosB;
  return {x:x1,y:y1,z:z2};
}

function project(p, scale, dist){
  const f = dist/(dist - p.z*scale*0.02);
  return {x: cx()+p.x*scale*f, y: cy()+p.y*scale*f, s:f};
}

let t=0;
let lastFrameTime = performance.now();

function motionProfile(){
  if(displayMode === 'speaking') return {breath:0.065, spin:1.35, flow:1.5};
  if(displayMode === 'listening') return {breath:0.045, spin:1.08, flow:1.2};
  if(displayMode === 'thinking') return {breath:0.08, spin:0.52, flow:1.75};
  return {breath:0.028, spin:0.7, flow:0.55};
}

function updateFailureFx(now){
  if(failureFx.phase === 'recover' && now-failureFx.phaseStarted > 900){
    failureFx.active = false;
    failureFx.phase = 'idle';
    electrons.forEach(e=>{ e.escaped=false; e.life=1; });
  }
}

function failureCoreMultiplier(now){
  if(!failureFx.active) return 1;
  const elapsed = now-failureFx.phaseStarted;
  if(failureFx.phase === 'destabilize') return 0.7 + 0.1*Math.abs(Math.sin(elapsed*0.02));
  if(failureFx.phase === 'recover') return Math.min(1, 0.7 + elapsed/900);
  return 1;
}

function drawFailureCracks(now, coreScale){
  // Removed in favor of Structural Destabilization
}

function draw(now = performance.now()){
  requestAnimationFrame(draw);
  const dt = Math.min(50, Math.max(0, now-lastFrameTime));
  lastFrameTime = now;
  const seconds = dt/1000;
  const frame = reduceMotion ? 0 : dt/(1000/60);
  if(!reduceMotion) t += seconds;

  // Keep the soft after-image, independent of monitor refresh rate.
  const trailAlpha = 1-Math.pow(0.65, Math.max(frame, 1));
  ctx.fillStyle = `rgba(0,0,0,${trailAlpha})`;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // read audio amplitude
  if(analyser){
    analyser.getByteTimeDomainData(dataArray);
    let sum=0;
    for(let i=0;i<dataArray.length;i++){
      const v=(dataArray[i]-128)/128;
      sum+=v*v;
    }
    targetAmp = Math.min(1, Math.sqrt(sum/dataArray.length)*4.5);
  } else if(mode==='demo'){
    targetAmp = (Math.sin(t*3)*0.5+0.5) * (0.4+0.6*Math.max(0,Math.sin(t*0.7)));
  } else {
    targetAmp *= 0.9;
  }
  const ampSmoothing = 1-Math.pow(0.75, Math.max(frame, 1));
  amplitude += (targetAmp-amplitude)*ampSmoothing;
  document.getElementById('amp').textContent = amplitude.toFixed(2);

  if(bootActive){
    const elapsed = performance.now() - bootStartTime;
    const bt = Math.min(1, elapsed / BOOT_DURATION_MS);
    const be = easeOutCubic(bt);
    for(let i=0;i<N;i++){
      pts[i].x = ptBootFrom[i].x + (ptRest[i].x - ptBootFrom[i].x)*be;
      pts[i].y = ptBootFrom[i].y + (ptRest[i].y - ptBootFrom[i].y)*be;
      pts[i].z = ptBootFrom[i].z + (ptRest[i].z - ptBootFrom[i].z)*be;
    }
    bootGlow = be;
    if(bt >= 1){
      bootActive = false;
      for(let i=0;i<N;i++){
        pts[i].x = ptRest[i].x;
        pts[i].y = ptRest[i].y;
        pts[i].z = ptRest[i].z;
      }
      bootGlow = 1;
    }
  }

  const ringMul = updateRingPulse();
  const profile = motionProfile();
  const breathe = 1 + (Math.sin(t*(displayMode === 'thinking' ? 2.5 : 1.65)) * profile.breath);
  const spinMul = bootActive ? 0.15 + bootGlow*0.85 : 1;
  angleY += (0.004 + amplitude*0.02)*spinMul*profile.spin*frame;
  angleX += 0.0015*spinMul*(0.8+profile.spin*0.2)*frame;

  const baseScale = Math.min(canvas.width, canvas.height)*0.16;
  const coreScale = baseScale*breathe*(1+amplitude*0.55);
  updateFailureFx(now);
  updateOutcomeGlow(now);
  const glowMul = bootGlow * outcomeGlowMultiplier;
  const coreGlowMul = glowMul * failureCoreMultiplier(now);

  if(successPing.pendingScale){
    successPing.startR = coreScale * 0.6;
    successPing.endR = coreScale * 3;
    successPing.pendingScale = false;
  }

  const isThinking = displayMode === 'thinking' && !reduceMotion;
  if(isThinking){
    if(!thinkingTickLastStep) thinkingTickLastStep = now;
    if(now - thinkingTickLastStep >= THINKING_TICK_STEP_MS){
      const steps = Math.floor((now-thinkingTickLastStep)/THINKING_TICK_STEP_MS);
      thinkingTickTargetAngle += THINKING_TICK_INCREMENT*steps;
      thinkingTickLastStep += THINKING_TICK_STEP_MS*steps;
      thinkingTickFlashUntil = now + 140;
    }
    // The scanner eases into each new sector, rather than snapping around the ring.
    const scanEase = 1-Math.pow(0.0008, seconds);
    thinkingTickAngle += shortestAngle(thinkingTickAngle, thinkingTickTargetAngle)*scanEase;
  } else if(thinkingTickLastStep){
    resetThinkingTick();
  }

  // outer glow rings (rotate + glow with amplitude)
  const ringCount = 3;
  for(let r=0;r<ringCount;r++){
    const rad = (baseScale*(2.1+r*0.55) + amplitude*30)*ringMul;
    ctx.save();
    ctx.translate(cx(),cy());
    const ringSpin = t*(0.15+r*0.08)*profile.spin*(r%2===0?1:-1);
    ctx.rotate(ringSpin);
    ctx.beginPath();
    const segs=64;
    for(let i=0;i<=segs;i++){
      const a = (i/segs)*Math.PI*2;
      const wob = Math.sin(a*6+t*4)*amplitude*6;
      const rr = rad+wob;
      const x = Math.cos(a)*rr;
      const y = Math.sin(a)*rr*0.42;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    const ringAlpha = (0.06+amplitude*0.55-r*0.02)*glowMul;
    ctx.strokeStyle = `rgba(255,255,255,${ringAlpha})`;
    ctx.lineWidth = 1+amplitude*1.5;
    ctx.shadowColor='#ffffff';
    ctx.shadowBlur = 6+amplitude*20;
    ctx.stroke();
    ctx.restore();
  }

  // ring-hugging tick particles (data pulses running along the rings)
  ticks.forEach(tk=>{
    tk.a += tk.speed*1.25*seconds*(1+amplitude*3)*profile.flow;
    const rad = (baseScale*(2.1+tk.ring*0.55) + amplitude*30)*ringMul;
    const dir = tk.ring%2===0?1:-1;
    const ang = tk.a + t*(0.15+tk.ring*0.08)*profile.spin*dir;
    const x = cx()+Math.cos(ang)*rad;
    const y = cy()+Math.sin(ang)*rad*0.42;
    ctx.beginPath();
    ctx.arc(x,y,1.3+amplitude*2,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${0.5+amplitude*0.5})`;
    ctx.shadowColor='#ffffff';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  if(isThinking){
    const outerIdx = ringCount - 1;
    const outerRad = (baseScale*(2.1+outerIdx*0.55) + amplitude*30)*ringMul;
    const tickFlash = now < thinkingTickFlashUntil;
    const tickSize = (2.6 + amplitude*2.2) * (tickFlash ? 1.5 : 1);
    const tickAlpha = tickFlash ? 1 : 0.82 + amplitude*0.15;
    const tx = cx() + Math.cos(thinkingTickAngle) * outerRad;
    const ty = cy() + Math.sin(thinkingTickAngle) * outerRad * 0.42;

    // A restrained diagnostic beam connects the core to the sector being evaluated.
    const beam = ctx.createLinearGradient(cx(), cy(), tx, ty);
    beam.addColorStop(0, 'rgba(255,255,255,0)');
    beam.addColorStop(0.55, `rgba(255,255,255,${0.1+amplitude*0.12})`);
    beam.addColorStop(1, `rgba(255,255,255,${0.45+amplitude*0.2})`);
    ctx.beginPath();
    ctx.moveTo(cx(), cy());
    ctx.lineTo(tx, ty);
    ctx.strokeStyle = beam;
    ctx.lineWidth = 0.8 + amplitude*0.6;
    ctx.stroke();

    // The fading dots make the scanner direction legible without adding visual noise.
    for(let i=4;i>0;i--){
      const tailAngle = thinkingTickAngle - i*0.13;
      const tailX = cx() + Math.cos(tailAngle)*outerRad;
      const tailY = cy() + Math.sin(tailAngle)*outerRad*0.42;
      ctx.beginPath();
      ctx.arc(tailX, tailY, Math.max(0.8, tickSize*(1-i*0.16)), 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${0.08+(4-i)*0.09})`;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(tx, ty, tickSize, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${tickAlpha})`;
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = tickFlash ? 18 : 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ambient dust field, drifting slowly, flickers brighter with amplitude
  dust.forEach(d=>{
    d.a += d.speed*0.625*seconds*(0.65+profile.flow*0.35);
    const rad = baseScale*d.r*(1+amplitude*0.15);
    const x = cx()+Math.cos(d.a)*rad;
    const y = cy()+Math.sin(d.a)*rad*0.5;
    const flicker = 0.15+0.25*Math.sin(t*2+d.phase)+amplitude*0.4;
    ctx.beginPath();
    ctx.arc(x,y,d.size,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0,flicker)})`;
    ctx.fill();
  });

// --- Polyhedron physics integration ---
pts.forEach((p,i)=>{
  const d = disp[i];
  if(failureFx.phase === 'destabilize'){
    d.x += d.vx * 0.35; d.y += d.vy * 0.35; d.z += d.vz * 0.35;
    d.vx *= 0.94; d.vy *= 0.94; d.vz *= 0.94;
  } else if(failureFx.phase === 'recover'){
    const k=0.08, damp=0.82;
    d.vx += -d.x * k; d.vy += -d.y * k; d.vz += -d.z * k;
    d.vx *= damp; d.vy *= damp; d.vz *= damp;
    d.x += d.vx; d.y += d.vy; d.z += d.vz;
  }
});

const animated = pts.map((p,i)=>({
  x: p.x + disp[i].x, y: p.y + disp[i].y, z: p.z + disp[i].z
}));

const projected = animated.map(p=>project(rotate(p,angleX,angleY), coreScale, 4));

// --- Bohr orbit rings (faint) ---
orbits.forEach(o=>{
  ctx.save();
  ctx.translate(cx(),cy());
  ctx.rotate(o.tilt + t*0.1);
  ctx.beginPath();
  for(let i=0;i<=48;i++){
    const a=(i/48)*Math.PI*2;
    const x=Math.cos(a)*o.radius*baseScale;
    const y=Math.sin(a)*o.radius*baseScale*0.5;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
    ctx.strokeStyle='rgba(255,255,255,0.035)';
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.restore();
});

// --- Electrons ---
electrons.forEach(e=>{
  const o=orbits[e.orbit];
  let x,y;
  if(!e.escaped){
    e.angle += o.speed*0.02;
    x = Math.cos(e.angle)*o.radius*baseScale;
    y = Math.sin(e.angle)*o.radius*Math.cos(o.tilt)*0.5*baseScale;
    x = cx()+x; y = cy()+y;
  } else {
    e.ex += e.evx; e.ey += e.evy;
    e.evx*=0.985; e.evy*=0.985;
    e.life -= 0.012;
    x = cx()+e.ex*baseScale*0.5; y = cy()+e.ey*baseScale*0.5;
    if(e.life<=0) return;
  }
  const alpha = e.escaped ? Math.max(0,e.life) : 0.85;
  const size = e.escaped ? 2.2*Math.max(0,e.life) : 2.4;
  ctx.beginPath();
  ctx.arc(x,y,size,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${alpha})`;
  ctx.shadowColor='#fff'; ctx.shadowBlur = e.escaped?8:4;
  ctx.fill();
  ctx.shadowBlur=0;
});

// wireframe polyhedron
  ctx.lineWidth = 1;
  edges.forEach(e=>{
    const a=projected[e.a], b=projected[e.b];
    const depth = (a.s+b.s)/2;
    ctx.strokeStyle = `rgba(255,255,255,${(0.12+depth*0.15+amplitude*0.25)*coreGlowMul})`;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  });
  projected.forEach(p=>{
    const ptRadius = Math.max(0, 1.4*p.s);
    if(ptRadius <= 0) return;
    ctx.beginPath();
    ctx.arc(p.x,p.y,ptRadius,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${(0.4+amplitude*0.5)*coreGlowMul})`;
    ctx.fill();
  });

  // glowing core
  const grad = ctx.createRadialGradient(cx(),cy(),0,cx(),cy(),coreScale*0.9);
  grad.addColorStop(0, `rgba(255,255,255,${0.9*coreGlowMul})`);
  grad.addColorStop(0.25, `rgba(255,255,255,${(0.55+amplitude*0.3)*coreGlowMul})`);
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx(),cy(),coreScale*0.55*(1+amplitude*0.4),0,Math.PI*2);
  ctx.fill();

  // System fault glitch: brief horizontal displacement bands
  if(failureFx.active && failureFx.phase !== 'idle'){
    failureFx.scanGlitch.forEach(glitch=>{
      const glitchOffset = Math.sin(now * 0.02 + glitch.phase) * 4;
      const glitchAlpha = (failureFx.phase === 'recover') ? 0 : 0.15;
      ctx.fillStyle = `rgba(255,255,255,${glitchAlpha})`;
      const yPos = cy() + glitch.yNorm * coreScale * 2;
      ctx.fillRect(cx() - coreScale * 2 + glitchOffset, yPos, coreScale * 4, 1);
    });
  }


  if(successPing.active){
    const pingElapsed = now - successPing.start;
    const pingDur = 500;
    if(pingElapsed >= pingDur){
      successPing.active = false;
    } else {
      const u = pingElapsed / pingDur;
      const pingR = successPing.startR + (successPing.endR - successPing.startR) * u;
      const pingAlpha = 0.8 * (1 - u);
      ctx.beginPath();
      ctx.arc(cx(), cy(), pingR, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,255,255,${pingAlpha})`;
      ctx.lineWidth = 1.2 + (1 - u) * 0.8;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 12 * (1 - u);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // particle bursts on amplitude spikes — denser, with size/speed variance
  const burstChance = 1-Math.pow(1-(0.15+amplitude*0.85), Math.max(frame, 1));
  if(!reduceMotion && amplitude>0.12 && Math.random()<burstChance){
    const bursts = 1+Math.floor(amplitude*4);
    for(let b=0;b<bursts;b++){
      const a = Math.random()*Math.PI*2;
      const spd = 0.8+amplitude*4*Math.random();
      particles.push({
        x:cx()+Math.cos(a)*coreScale*0.55,
        y:cy()+Math.sin(a)*coreScale*0.55,
        vx:Math.cos(a)*spd,
        vy:Math.sin(a)*spd,
        size:0.8+Math.random()*1.8,
        life:1
      });
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
  if(p.type === 'fail'){
    p.x += p.vx;
    p.y += p.vy;
    const decay = 0.016 / (p.maxLife || 1.8);
    p.life -= decay;
    if(p.life <= 0 || p.y > canvas.height + 12){
      particles.splice(i,1);
      continue;
    }
    const flicker = 0.3 + Math.random() * 0.55;
    const failRadius = Math.max(0, p.size * p.life);
    if(failRadius <= 0) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, failRadius, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, p.life * flicker)})`;
    ctx.fill();
    continue;
  }
    p.x+=p.vx*frame; p.y+=p.vy*frame; p.vx*=Math.pow(0.99,frame); p.vy*=Math.pow(0.99,frame); p.life-=0.018*frame;
    if(p.life<=0){particles.splice(i,1);continue;}
    const burstRadius = Math.max(0, p.size*p.life);
    if(burstRadius <= 0) continue;
    ctx.beginPath();
    ctx.arc(p.x,p.y,burstRadius,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${p.life})`;
    ctx.shadowColor='#ffffff';
    ctx.shadowBlur = 4;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}
draw();

// ---- UI SFX (separate from sage-audio / AnalyserNode) ----
const SFX_VOLUME = 0.45;
const SFX_VOLUME_OVERRIDES = {
  shatter: 0.14,
  crack: 0.35,
  fail: 0.4,
};
function getSfxVolume(key){
  return SFX_VOLUME_OVERRIDES[key] ?? SFX_VOLUME;
}
const sfxElements = {
  startup: document.getElementById('sfx-startup'),
  overlayAppear: document.getElementById('sfx-overlay-appear'),
  coreOpen: document.getElementById('sfx-core-open'),
  coreClose: document.getElementById('sfx-core-close'),
  interfaceClick: document.getElementById('sfx-interface-click'),
  thinking: document.getElementById('sfx-thinking'),
  fail: document.getElementById('sfx-fail'),
  crack: document.getElementById('sfx-crack'),
  shatter: document.getElementById('sfx-shatter'),
};
const sfxFiles = {
  startup: '../assets/sfx/Startup.wav',
  overlayAppear: '../assets/sfx/Overlay_apear.wav',
  coreOpen: '../assets/sfx/core_UI_open.wav',
  coreClose: '../assets/sfx/Core_UI_Close.wav',
  interfaceClick: '../assets/sfx/interface click.wav',
  thinking: '../assets/sfx/AI_Thinking_idle.wav',
  fail: '../assets/sfx/fail.ogg',
  crack: '../assets/sfx/crack.ogg',
  shatter: '../assets/sfx/shatter.ogg',
};
const uiSfx = sfxElements;
const uiSfxSrc = sfxFiles;
const THINKING_SFX_VOLUME = 0.38;
let thinkingFadeTimer = null;
Object.keys(uiSfx).forEach(key=>{
  uiSfx[key].volume = SFX_VOLUME;
  uiSfx[key].src = uiSfxSrc[key];
});

function stopThinkingSfx(fadeMs = 250){
  const el = uiSfx.thinking;
  if(!el) return;
  if(thinkingFadeTimer){
    clearInterval(thinkingFadeTimer);
    thinkingFadeTimer = null;
  }
  if(el.paused){ el.loop = false; return; }
  const startVol = el.volume;
  const steps = Math.max(1, Math.floor(fadeMs / 40));
  let step = 0;
  thinkingFadeTimer = setInterval(()=>{
    step += 1;
    el.volume = Math.max(0, startVol * (1 - step / steps));
    if(step >= steps){
      clearInterval(thinkingFadeTimer);
      thinkingFadeTimer = null;
      el.pause();
      el.currentTime = 0;
      el.loop = false;
      el.volume = THINKING_SFX_VOLUME;
    }
  }, fadeMs / steps);
}

function startThinkingSfx(){
  const el = uiSfx.thinking;
  if(!el) return;
  if(thinkingFadeTimer){
    clearInterval(thinkingFadeTimer);
    thinkingFadeTimer = null;
  }
  el.loop = true;
  el.volume = THINKING_SFX_VOLUME;
  el.currentTime = 0;
  el.play().catch(()=>{ el.loop = false; });
}

function playSfxUntilEnd(key){
  const el = uiSfx[key];
  if(!el) return Promise.resolve();
  el.pause();
  el.currentTime = 0;
  el.loop = false;
    el.volume = getSfxVolume(key);
  return new Promise(resolve=>{
    let settled = false;
    const done = ()=>{
      if(settled) return;
      settled = true;
      clearTimeout(fallback);
      resolve();
    };
    const fallback = setTimeout(done, 2200);
    el.addEventListener('ended', done, {once:true});
    el.play().catch(done);
  });
}

async function startFailureSequence(sequence){
  // Removed in favor of structural destabilization
}

window.playUiSfx = (key)=>{
  const el = uiSfx[key];
  if(!el) return;
  if(key === 'thinking'){ startThinkingSfx(); return; }
    el.volume = getSfxVolume(key);
  el.currentTime = 0;
  el.play().catch(()=>{});
};

(function initOverlayLifecycle(){
  bootStartTime = performance.now();
  playUiSfx('startup');
  const wrap = document.getElementById('wrap');
  let revealed = false;
  const reveal = ()=>{
    if(revealed) return;
    revealed = true;
    wrap.classList.add('window-visible');
  };
  requestAnimationFrame(()=>{
    playUiSfx('overlayAppear');
    reveal();
  });
  // Some WebView hosts delay animation frames while the transparent window is created.
  setTimeout(reveal, 250);
})();

// ---- Audio setup ----
const modeLabel = document.getElementById('mode');
const micBtn = document.getElementById('micBtn');
const demoBtn = document.getElementById('demoBtn');
const stopBtn = document.getElementById('stopBtn');

function isEngagedDisplay(m){
  return m === 'listening' || m === 'speaking' || m === 'thinking';
}

function internalToDisplayMode(m){
  if(m === 'mic') return 'listening';
  if(m === 'speaking') return 'speaking';
  if(m === 'demo') return 'listening';
  return 'standby';
}

function handleDisplayModeTransition(oldM, newM){
  if(oldM === newM) return;

  if(newM === 'thinking' && oldM !== 'thinking'){
    startThinkingSfx();
  }
  if(oldM === 'thinking' && newM !== 'thinking'){
    stopThinkingSfx();
  }

  if(oldM === 'standby' && (newM === 'listening' || newM === 'speaking')){
    playUiSfx('coreOpen');
    startRingPulse('open');
  } else if(newM === 'standby' && isEngagedDisplay(oldM)){
    playUiSfx('coreClose');
    startRingPulse('close');
  }
}

let prevDisplayMode = 'standby';

function applyMode(m, opts = {}){
  const newDisplay = internalToDisplayMode(m);
  if(opts.transition !== false){
    handleDisplayModeTransition(prevDisplayMode, newDisplay);
    prevDisplayMode = newDisplay;
  }
  mode = m;
  modeLabel.textContent = m==='mic' ? 'LISTENING' : m==='demo' ? 'DEMO MODE' : m==='speaking' ? 'SPEAKING' : 'STANDBY';
  micBtn.classList.toggle('active', m==='mic');
  demoBtn.classList.toggle('active', m==='demo');
}

async function startMic(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    dataArray = new Uint8Array(analyser.fftSize);
    source.connect(analyser);
    applyMode('mic');
  }catch(err){
    document.getElementById('transcript').textContent = 'Không truy cập được micro — thử DEMO thay thế.';
    applyMode('standby');
  }
}

function stopAll(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(audioCtx){ audioCtx.close(); audioCtx=null; }
  analyser=null; dataArray=null;
  targetAmp=0;
  applyMode('standby');
}

micBtn.addEventListener('click', ()=>{ stopAll(); startMic(); });
demoBtn.addEventListener('click', ()=>{ stopAll(); applyMode('demo'); });
stopBtn.addEventListener('click', stopAll);

// ---- Python-Integration Bridge ----
const sageAudio = document.getElementById('sage-audio');
let audioSource = null;

// Debug mode check: show controls and hint if ?debug=1 is in URL
(function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('debug') === '1') {
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('hint').style.display = 'block';
  }
})();

window.setMode = (m) => {
  const modeMap = {
    'standby': 'standby',
    'listening': 'mic',
    'speaking': 'speaking',
    'thinking': 'standby'
  };
  const internalMode = modeMap[m] || 'standby';

  handleDisplayModeTransition(prevDisplayMode, m);
  if(prevDisplayMode === 'thinking' && m !== 'thinking'){
    resetThinkingTick();
  }
  prevDisplayMode = m;
  displayMode = m;

  applyMode(internalMode, { transition: false });

  const labels = {
    'standby': 'STANDBY',
    'listening': 'LISTENING',
    'speaking': 'SPEAKING',
    'thinking': 'THINKING'
  };
  modeLabel.textContent = labels[m] || 'STANDBY';
};

window.setCaption = (text) => {
  document.getElementById('transcript').textContent = ''; // Clear previous
  window.currentCaptionText = text;
};

window.setCaptionSynced = (text, audioDurationSeconds) => {
  const transcriptElem = document.getElementById('transcript');
  transcriptElem.textContent = '';

  const words = text.split(' ');
  if (words.length === 0) return;

  const delayPerWord = (audioDurationSeconds * 1000) / words.length;
  let currentText = '';

  words.forEach((word, index) => {
    setTimeout(() => {
      currentText += (currentText ? ' ' : '') + word;
      transcriptElem.textContent = currentText;
    }, index * delayPerWord);
  });
};

window.playVoiceLine = async (url) => {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (!analyser) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      dataArray = new Uint8Array(analyser.fftSize);
    }

    if (!audioSource) {
      audioSource = audioCtx.createMediaElementSource(sageAudio);
      audioSource.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    sageAudio.src = url;

    sageAudio.onerror = (e) => {
      console.error("Audio element error:", sageAudio.error);
      window.setMode('standby');
    };

    return new Promise((resolve) => {
      sageAudio.addEventListener('play', () => {
        if (window.currentCaptionText) {
          window.setCaptionSynced(window.currentCaptionText, sageAudio.duration);
        }
      });

      sageAudio.onended = () => {
        window.setMode('standby');
        resolve();
      };

      sageAudio.play().catch(e => {
        console.error("Playback failed:", e);
        resolve();
      });
    });
  } catch (err) {
    console.error("Error playing voice line:", err);
    window.setCaption("Error playing audio file.");
  }
};
